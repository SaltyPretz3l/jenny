[package]
name = "jenny-team-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Team transport bridge for Jenny: iroh host and member modes behind a line-JSON control channel"
license = "MIT"
publish = false

[lib]
name = "jenny_team_bridge"
path = "src/lib.rs"

[[bin]]
name = "jenny-team-bridge"
path = "src/main.rs"

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "~1.54", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "sync",
    "time",
] }
serde_json = "~1.0"
base64 = "~0.22"
zeroize = "~1.9"
portmapper = { version = "=0.19.3", default-features = false }

[dev-dependencies]
# Paused time for the port mapping task's timers; a feature of the tokio already locked.
tokio = { version = "~1.54", features = ["test-util"] }
# The loopback test relay (`iroh::test_utils::run_relay_server`), tests only; the shipped binary
# never builds this feature (check_team_transport_boundary.py).
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "test-utils"] }
# A token-checking test relay (`iroh_relay::server::AccessControl`, not re-exported by iroh), tests
# only; the same package and version the line above already locks.
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
