[package]
name = "jenny-team-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Team transport bridge for Jenny: iroh host and member modes behind a line-JSON control channel"
license = "MIT"
publish = false

[lib]
name = "jenny_team_bridge"
path = "src/lib.rs"

[[bin]]
name = "jenny-team-bridge"
path = "src/main.rs"

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "~1.54", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "sync",
    "time",
] }
serde_json = "~1.0"
base64 = "~0.22"
zeroize = "~1.9"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
