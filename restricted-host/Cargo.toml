[package]
name = "jenny-plugin-host"
version = "1.0.0"
edition = "2024"
license = "Proprietary"
publish = false

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
hex = "0.4.3"
hmac = "0.12.1"
interprocess = "2.4.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
wasmtime = { version = "=47.0.3", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.177"

[dev-dependencies]
wat = "1.240.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
