[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_configs = true

# Optional/heavy deps that are not part of the locked runtime and ship no type
# stubs. They are imported defensively (lazy, inside try/except) so a missing
# install degrades gracefully; mypy must not fail the gate when they are absent
# from the checking environment. (transformers is the tokenizer backend;
# rapidocr is the optional scanned-PDF OCR engine from the external media site.)
[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "rapidocr"]
ignore_missing_imports = true
