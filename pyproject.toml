[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-sidecar"
version = "1.3.1"
description = "Python AI sidecar for the Companion desktop app"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "defusedxml==0.7.1",
    "filelock>=3.16.0,<4.0",
    "httpx>=0.27.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "openpyxl==3.1.5",
    "psutil>=7.2.0,<8.0",
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4.0"]
content = [
    "html2text==2025.4.15",
]
media = [
    "Pillow==12.3.0",
    "PyMuPDF==1.27.2.2",
]
ocr = [
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.4.3",
]
spreadsheet = [
    "defusedxml==0.7.1",
    "openpyxl==3.1.5",
]
office = [
    "defusedxml==0.7.1",
]
dev = [
    "html2text==2025.4.15",
    "Pillow==12.3.0",
    "PyMuPDF==1.27.2.2",
    "defusedxml==0.7.1",
    "openpyxl==3.1.5",
    "pandas==3.0.1",
    "numpy==2.4.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.15.6,<0.17",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyinstaller>=6.16.0,<7.0",
]
packaging = [
    "pyinstaller>=6.16.0,<7.0",
]
all = [
    "ollama>=0.4.0",
    "html2text==2025.4.15",
    "Pillow==12.3.0",
    "PyMuPDF==1.27.2.2",
    "defusedxml==0.7.1",
    "openpyxl==3.1.5",
    "pandas==3.0.1",
    "numpy==2.4.3",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "opencv-python-headless==5.0.0.93",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.15.6,<0.17",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyinstaller>=6.16.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["sidecar*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests/sidecar"]
addopts = "-v --tb=short --strict-markers"
# Pin asyncio handling explicitly so a future async test can't silently no-op:
# strict mode requires @pytest.mark.asyncio, so an unmarked `async def test_`
# is reported (errored/skipped) rather than collected-and-never-awaited. There
# are zero async tests today, so this only closes the latent trap.
asyncio_mode = "strict"
# The opt-in real-Ollama smokes under tests/sidecar/live/ self-skip via skipif,
# but excluding the dir from recursive collection keeps them out of the normal
# `pytest tests/sidecar` / coverage lane entirely. The live lane invokes the
# file by explicit path (scripts/tests/run-live-ollama.js), which still collects.
# norecursedirs REPLACES pytest's built-in exclusion list rather than extending
# it, so the usual build/cache dirs are re-listed alongside "live" to keep them
# from being recursed if one ever lands under tests/sidecar.
norecursedirs = ["live", "*.egg", ".*", "build", "dist", "node_modules", "venv"]
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
]

[tool.coverage.report]
# Single source of truth for the sidecar coverage floor (Phase 3 of the
# test-coverage ratchet). pytest-cov reads this when --cov-fail-under is absent,
# so package.json (test:sidecar:cov) and scripts/checks/run_ci.py no longer pass
# the flag inline. Raised 70 -> 75 on 2026-06-13 after stable baselines (measured
# sidecar coverage ~86.3%, an ~11pp buffer); next rung 78 after more soak. See
# docs/plans/TEST_COVERAGE_RATCHET.md.
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "PL", "B", "BLE", "I", "RUF100"]
# PLC0415 (import-outside-top-level): lazy imports are a deliberate sidecar pattern
# (import-cycle avoidance, startup cost, lazily loaded tool handlers), not debt.
# PLR0917 (too-many-positional-arguments, stable from ruff 0.16): every hit is also a
# PLR0913 hit, so PLR0913 stays the one arity rule and its noqa/allowlist entries govern.
ignore = ["PLC0415", "PLR0917"]
# RUF100 fails stale noqa. BLE001 noqa is exempt from that check only: ruff 0.16 stopped
# flagging handlers that log with exc_info=True, so those noqa read as stale there but
# are still required on older ruff (0.15.x). BLE001 itself stays enforced.
external = ["BLE001"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 50
max-public-methods = 15

[tool.ruff.lint.isort]
known-first-party = ["sidecar"]

